<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="#" method="post">
    <fieldset>
        <legend>Informações pessoais</legend>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Email falso" required>

        <label for="senha">Crie uma senha:</label>
        <input type="password" id="senha" name="senha" minlength="6" maxlength="12" required>
        
        <label for="nascimento">Data nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>

        <h2>Contato elocalização.</h2>

        <label for="telefone">telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="cidade">cidade:</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="nome">Nome completo:</label>
        <select id="estado" name="estado" required>
            <option value="">selecione...</option>
            <option value="SC">Santa Catarina</option>
            <option value="PR">Paraná</option>
            <option value="RS">Rio Grande do Sul</option>

        </select>
<h2>Preferencias de Servigo </h2>

<p>Deseja receber novidades por e-mail?</p>

<input type="radio" id="sin" name="novidades" value="sin" required>

<label for="sim">Sim</label>

<input type="radio" id="nao" name-"novidades" value="nao">

<label for="nao">Go</label>

<p>selecione os serviços de interesse:</p>

<input type="checkbox" id="web" name="servicos" value="web">

<label for="web">Desenvolvimento Web</label>

<input type="checkbox" id="design" name="servicos" value="design">

<label for="design">Design Digital</label>

<input type="checkbox" id="redes" name="servicos" value="redes">

<label for="redes">Redes de Computadores</label>

</fieldset>

<legend>Comentarios </legend>

<label for="mensagen">Deixe una mensagem (opcional):</label>

<br>

<textarea id="mensagen" name="mensagen" rows="14" cols="50" placeholder="Digite suas observações..."></textarea>

<br>

<button type="submit">Enviar Cadastro</button>

<button type="reset">Limpar</button>
</form>

</body>
</html>
